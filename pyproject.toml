[project]
name = "gitscope-bot"
version = "2.0.0"
description = "A Telegram bot for exploring GitHub repositories and user profiles"
authors = [
    { name = "Fahad Hossain", email = "fahadshuvo33@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-telegram-bot>=21.0,<22.0",
    "aiohttp>=3.9.1",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["commands", "templates", "utils"]

[tool.uv]
dev-dependencies = []
